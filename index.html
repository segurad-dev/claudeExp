<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Tracker</title>
<style>
  /* ── Reset ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Page ── */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: #e8eef3;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 10px 40px;
    color: #1a2c2c;
  }

  /* ── Phone shell ── */
  .phone {
    width: 100%;
    max-width: 420px;
    background: #b8d4d4;
    border-radius: 28px;
    padding: 14px;
    box-shadow: 0 14px 44px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ── Metric selector ── */
  .metric-selector {
    background: #fff;
    border: 2px solid #0a0a0a;
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .metric-selector span {
    font-size: 11px;
    font-weight: 700;
    color: #475569;
    white-space: nowrap;
  }
  .metric-selector select {
    flex: 1;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    color: #0f172a;
    background: transparent;
  }

  /* ── Chart card ── */
  .chart-card {
    background: #fff;
    border: 2px solid #0a0a0a;
    border-radius: 10px;
    overflow: hidden;
  }
  .date-strip {
    height: 22px;
    background: linear-gradient(90deg, #3b82f6 0%, #16a34a 50%, #f59e0b 100%);
    cursor: pointer;
    position: relative;
    transition: filter .15s;
  }
  .date-strip:hover { filter: brightness(1.08); }
  .date-strip .label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #fff; font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,.4);
    pointer-events: none;
  }

  .col-headers {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 6px 4px 4px;
    background: #fafafa;
    border-bottom: 1px solid #e5e7eb;
  }
  .col-headers .cell { text-align: center; }
  .col-headers .interval { color: #475569; font-weight: 600; font-size: 9px; }
  .col-headers .num { color: #0a0a0a; font-weight: 700; font-size: 14px; margin-top: 1px; }

  .chart-wrap { position: relative; }
  .chart-svg { display: block; width: 100%; height: 220px; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: #0f172a;
    color: #fff;
    font-size: 11px;
    padding: 6px 8px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    transform: translate(-50%, -120%);
    transition: opacity .12s;
    z-index: 3;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
    line-height: 1.5;
  }
  .tooltip.visible { opacity: 1; }

  .ref-legend {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    padding: 6px 10px 8px;
    font-size: 10px;
    color: #334155;
    border-top: 1px solid #e5e7eb;
  }
  .swatch-band {
    width: 18px; height: 9px;
    background: rgba(34,197,94,.35);
    border: 1px solid rgba(34,197,94,.7);
    border-radius: 2px;
  }
  .swatch-dot { width: 8px; height: 8px; border-radius: 50%; }

  .date-controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
    padding: 4px 6px 8px;
    background: #f1f5f9;
    border-top: 1px solid #e5e7eb;
  }
  .date-chip {
    font-size: 9px;
    text-align: center;
    padding: 4px 2px;
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    cursor: pointer;
    transition: all .12s;
    color: #334155;
    line-height: 1.3;
  }
  .date-chip:hover { border-color: #0f172a; background: #f8fafc; }
  .date-chip .dc-day { font-weight: 700; color: #0f172a; font-size: 11px; }
  .date-chip .dc-mon { font-size: 8px; color: #64748b; text-transform: uppercase; }
  .date-chip .dc-val { font-size: 8px; font-weight: 700; }
  .ok  { color: #16a34a; }
  .bad { color: #dc2626; }

  /* ── Empty state ── */
  .empty-state {
    background: #fff;
    border: 2px dashed #94a3b8;
    border-radius: 10px;
    padding: 24px 16px;
    text-align: center;
    color: #475569;
    font-size: 13px;
    line-height: 1.5;
  }
  .empty-state strong { color: #0f172a; display: block; margin-bottom: 6px; }

  /* ── Note card ── */
  .note-card {
    background: #fff;
    border: 2px solid #65a30d;
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .note-card > span {
    font-size: 10px;
    font-weight: 700;
    color: #4d7c0f;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .note-card textarea {
    border: none;
    resize: none;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    color: #1a2c2c;
    line-height: 1.4;
    min-height: 60px;
    background: transparent;
  }

  /* ── Bottom bar ── */
  .bottom-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .add-btn {
    width: 54px; height: 54px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #16a34a;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 3px 10px rgba(22,163,74,.22);
  }
  .add-btn:hover  { transform: scale(1.05); }
  .add-btn:active { transform: scale(.97); }
  .add-btn svg { width: 28px; height: 28px; }

  .input-field {
    flex: 1;
    height: 48px;
    background: #fff;
    border: 2px solid #0a0a0a;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .input-field:focus { border-color: #16a34a; }

  .menu {
    position: absolute;
    bottom: 64px; left: 0;
    background: #fff;
    border: 1.5px solid #0a0a0a;
    border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,.18);
    padding: 6px;
    display: none;
    flex-direction: column;
    min-width: 180px;
    z-index: 5;
  }
  .menu.open { display: flex; }
  .menu button {
    background: none;
    border: none;
    padding: 10px 12px;
    text-align: left;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #1a2c2c;
  }
  .menu button:hover { background: #f1f5f9; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    gap: 8px;
    padding-top: 2px;
  }
  .toolbar button {
    flex: 1;
    padding: 6px 4px;
    font-size: 11px;
    background: rgba(255,255,255,.4);
    border: 1px solid rgba(0,0,0,.2);
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    color: #0f172a;
  }
  .toolbar button:hover { background: rgba(255,255,255,.7); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #0f172a;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: all .25s;
    pointer-events: none;
    z-index: 30;
    max-width: 90vw;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error   { background: #dc2626; }
  .toast.success { background: #16a34a; }

  /* ── Modal ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(15,23,42,.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    max-width: 380px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h3   { font-size: 16px; margin-bottom: 4px; }
  .modal .sub { font-size: 12px; color: #64748b; margin-bottom: 14px; }

  .modal .field { margin-bottom: 10px; }
  .modal .field > label {
    font-size: 11px; font-weight: 700; color: #334155;
    display: block; margin-bottom: 4px;
  }
  .modal .field input,
  .modal .field select,
  .modal .field textarea {
    width: 100%;
    border: 1.5px solid #cbd5e1;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
    color: #0f172a;
  }
  .modal .field textarea { resize: vertical; min-height: 56px; }
  .modal .field input:focus,
  .modal .field select:focus,
  .modal .field textarea:focus { border-color: #16a34a; }

  .ref-hint {
    font-size: 11px; color: #64748b;
    padding: 6px 8px;
    background: #f8fafc;
    border-radius: 5px;
    margin-top: -4px;
    margin-bottom: 10px;
  }

  .modal-actions {
    display: flex; gap: 8px;
    justify-content: flex-end;
    margin-top: 14px;
  }
  .modal-actions button {
    padding: 8px 14px;
    border: none; border-radius: 6px;
    font-size: 13px; cursor: pointer;
    font-family: inherit; font-weight: 600;
  }
  .btn-primary   { background: #16a34a; color: #fff; }
  .btn-secondary { background: #e2e8f0; color: #334155; }
  .btn-danger    { background: #fecaca; color: #991b1b; }

  /* ── Day modal rows ── */
  .day-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px;
    background: #f8fafc;
    border-radius: 7px;
    margin-bottom: 6px;
  }
  .day-row .dr-name { flex: 1.5; font-size: 12px; font-weight: 600; color: #334155; }
  .day-row .dr-val  { font-size: 14px; font-weight: 700; }
  .day-row .dr-unit { font-size: 11px; color: #64748b; }
  .day-row .dr-note {
    flex: 2; font-size: 11px; color: #94a3b8;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .day-row .dr-del {
    background: none; border: none;
    cursor: pointer; color: #ef4444;
    font-size: 16px; padding: 2px 6px; line-height: 1;
  }
</style>
</head>
<body>

<div class="phone">

  <!-- Metric selector: options populated by JS -->
  <div class="metric-selector">
    <span>Метрика:</span>
    <select id="metricSelect"></select>
  </div>

  <!-- Chart area: filled by renderChartArea() -->
  <div id="chartArea"></div>

  <!-- Note card -->
  <div class="note-card">
    <span>Заметка в свободной форме</span>
    <textarea placeholder="Самочувствие, лекарства, диета, нагрузка, сон…"></textarea>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="menu">
      <button>⌨️ Ввести вручную</button>
    </div>
    <button class="add-btn" title="Добавить замер">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 2h6M10 2v13a2 2 0 0 0 4 0V2" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M10 11h4v4a2 2 0 0 1-4 0v-4z" fill="#fb923c"/>
      </svg>
    </button>
    <input class="input-field" type="text" placeholder="Заметка (Enter — сохранить)">
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button>🗑 Очистить</button>
    <button>📤 Экспорт</button>
    <button>📥 Импорт</button>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox"></div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  METRICS — справочник показателей
//  ref: диапазон нормы для взрослого мужчины
// ══════════════════════════════════════════════════════
const METRICS = {
  hemoglobin:    { name: 'Гемоглобин',          units: ['g/L', 'g/dL'],      def: 'g/L',    ref: { min: 130,  max: 170  } },
  glucose:       { name: 'Глюкоза',             units: ['mmol/L', 'mg/dL'],  def: 'mmol/L', ref: { min: 3.9,  max: 5.9  } },
  tsh:           { name: 'ТТГ',                 units: ['mIU/L'],            def: 'mIU/L',  ref: { min: 0.4,  max: 4.0  } },
  cholesterol:   { name: 'Общий холестерин',    units: ['mmol/L', 'mg/dL'],  def: 'mmol/L', ref: { min: 3.9,  max: 5.2  } },
  ldl:           { name: 'ЛПНП',                units: ['mmol/L', 'mg/dL'],  def: 'mmol/L', ref: { min: 1.8,  max: 3.0  } },
  hdl:           { name: 'ЛПВП',                units: ['mmol/L', 'mg/dL'],  def: 'mmol/L', ref: { min: 1.0,  max: 1.7  } },
  triglycerides: { name: 'Триглицериды',        units: ['mmol/L', 'mg/dL'],  def: 'mmol/L', ref: { min: 0.5,  max: 1.7  } },
  creatinine:    { name: 'Креатинин',           units: ['μmol/L', 'mg/dL'],  def: 'μmol/L', ref: { min: 62,   max: 115  } },
  alt:           { name: 'АЛТ',                 units: ['U/L'],              def: 'U/L',    ref: { min: 7,    max: 45   } },
  ast:           { name: 'АСТ',                 units: ['U/L'],              def: 'U/L',    ref: { min: 10,   max: 40   } },
  vitaminD:      { name: 'Витамин D (25-OH)',   units: ['nmol/L', 'ng/mL'],  def: 'nmol/L', ref: { min: 75,   max: 150  } },
  ferritin:      { name: 'Ферритин',            units: ['ng/mL', 'μg/L'],    def: 'ng/mL',  ref: { min: 30,   max: 300  } },
  esr:           { name: 'СОЭ',                 units: ['mm/h'],             def: 'mm/h',   ref: { min: 2,    max: 15   } },
};

const MKEYS = Object.keys(METRICS);

// ══════════════════════════════════════════════════════
//  Хранилище
//  Формат: { version: 1, measurements: [...] }
// ══════════════════════════════════════════════════════
const SKEY = 'healthtracker.data';

function load() {
  try {
    const raw = localStorage.getItem(SKEY);
    return raw ? JSON.parse(raw) : { version: 1, measurements: [] };
  } catch {
    return { version: 1, measurements: [] };
  }
}

function save(data) {
  localStorage.setItem(SKEY, JSON.stringify(data));
}

// ══════════════════════════════════════════════════════
//  Состояние
// ══════════════════════════════════════════════════════
let curMetric = MKEYS[0]; // выбранная метрика

// ══════════════════════════════════════════════════════
//  Metric selector — заполняем из METRICS
// ══════════════════════════════════════════════════════
const metricSelect = document.getElementById('metricSelect');

MKEYS.forEach(key => {
  metricSelect.appendChild(new Option(METRICS[key].name, key));
});

metricSelect.value = curMetric;

metricSelect.addEventListener('change', () => {
  curMetric = metricSelect.value;
  renderChartArea(); // будет реализована в следующих коммитах
});

// ══════════════════════════════════════════════════════
//  renderChartArea — пока показывает только empty-state
//  (chart rendering — Commit 4)
// ══════════════════════════════════════════════════════
function renderChartArea() {
  const m   = METRICS[curMetric];
  const all = load();
  const pts = all.measurements.filter(e => e.metric === curMetric);
  const area = document.getElementById('chartArea');

  if (pts.length === 0) {
    area.innerHTML = `
      <div class="empty-state">
        <strong>Нет данных по «${m.name}»</strong>
        Нажмите кнопку с пробиркой и введите первый замер.
      </div>`;
    return;
  }

  // Заглушка на случай если данные уже есть (до Commit 4)
  area.innerHTML = `
    <div class="empty-state">
      <strong>${m.name}</strong>
      Найдено замеров: ${pts.length}. График появится в следующем коммите.
    </div>`;
}

// ══════════════════════════════════════════════════════
//  Старт
// ══════════════════════════════════════════════════════
renderChartArea();
</script>

</body>
</html>
