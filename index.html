<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Health Tracker</title>
<style>
  /* ── Reset ── */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── Page ── */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background: #e8eef3;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 10px 40px;
    color: #1a2c2c;
  }

  /* ── Phone shell ── */
  .phone {
    width: 100%;
    max-width: 420px;
    background: #b8d4d4;
    border-radius: 28px;
    padding: 14px;
    box-shadow: 0 14px 44px rgba(0,0,0,0.18);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ── Metric selector ── */
  .metric-selector {
    background: #fff;
    border: 2px solid #0a0a0a;
    border-radius: 10px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .metric-selector span {
    font-size: 11px;
    font-weight: 700;
    color: #475569;
    white-space: nowrap;
  }
  .metric-selector select {
    flex: 1;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    color: #0f172a;
    background: transparent;
  }

  /* ── Chart card ── */
  .chart-card {
    background: #fff;
    border: 2px solid #0a0a0a;
    border-radius: 10px;
    overflow: hidden;
  }
  .date-strip {
    height: 22px;
    background: linear-gradient(90deg, #3b82f6 0%, #16a34a 50%, #f59e0b 100%);
    cursor: pointer;
    position: relative;
    transition: filter .15s;
  }
  .date-strip:hover { filter: brightness(1.08); }
  .date-strip .label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; color: #fff; font-weight: 600;
    text-shadow: 0 1px 2px rgba(0,0,0,.4);
    pointer-events: none;
  }

  .col-headers {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 6px 4px 4px;
    background: #fafafa;
    border-bottom: 1px solid #e5e7eb;
  }
  .col-headers .cell { text-align: center; }
  .col-headers .interval { color: #475569; font-weight: 600; font-size: 9px; }
  .col-headers .num { color: #0a0a0a; font-weight: 700; font-size: 14px; margin-top: 1px; }

  .chart-wrap { position: relative; }
  .chart-svg { display: block; width: 100%; height: 220px; }

  .tooltip {
    position: absolute;
    pointer-events: none;
    background: #0f172a;
    color: #fff;
    font-size: 11px;
    padding: 6px 8px;
    border-radius: 6px;
    white-space: nowrap;
    opacity: 0;
    transform: translate(-50%, -120%);
    transition: opacity .12s;
    z-index: 3;
    box-shadow: 0 6px 18px rgba(0,0,0,.25);
    line-height: 1.5;
  }
  .tooltip.visible { opacity: 1; }

  .ref-legend {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    padding: 6px 10px 8px;
    font-size: 10px;
    color: #334155;
    border-top: 1px solid #e5e7eb;
  }
  .swatch-band {
    width: 18px; height: 9px;
    background: rgba(34,197,94,.35);
    border: 1px solid rgba(34,197,94,.7);
    border-radius: 2px;
  }
  .swatch-dot { width: 8px; height: 8px; border-radius: 50%; }

  .date-controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 3px;
    padding: 4px 6px 8px;
    background: #f1f5f9;
    border-top: 1px solid #e5e7eb;
  }
  .date-chip {
    font-size: 9px;
    text-align: center;
    padding: 4px 2px;
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    cursor: pointer;
    transition: all .12s;
    color: #334155;
    line-height: 1.3;
  }
  .date-chip:hover { border-color: #0f172a; background: #f8fafc; }
  .date-chip .dc-day { font-weight: 700; color: #0f172a; font-size: 11px; }
  .date-chip .dc-mon { font-size: 8px; color: #64748b; text-transform: uppercase; }
  .date-chip .dc-val { font-size: 8px; font-weight: 700; }
  .ok  { color: #16a34a; }
  .bad { color: #dc2626; }

  /* ── Empty state ── */
  .empty-state {
    background: #fff;
    border: 2px dashed #94a3b8;
    border-radius: 10px;
    padding: 24px 16px;
    text-align: center;
    color: #475569;
    font-size: 13px;
    line-height: 1.5;
  }
  .empty-state strong { color: #0f172a; display: block; margin-bottom: 6px; }

  /* ── Note card ── */
  .note-card {
    background: #fff;
    border: 2px solid #65a30d;
    border-radius: 10px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .note-card > span {
    font-size: 10px;
    font-weight: 700;
    color: #4d7c0f;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .note-card textarea {
    border: none;
    resize: none;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    color: #1a2c2c;
    line-height: 1.4;
    min-height: 60px;
    background: transparent;
  }

  /* ── Bottom bar ── */
  .bottom-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .add-btn {
    width: 54px; height: 54px;
    border-radius: 50%;
    background: #fff;
    border: 3px solid #16a34a;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform .15s, box-shadow .15s;
    box-shadow: 0 3px 10px rgba(22,163,74,.22);
  }
  .add-btn:hover  { transform: scale(1.05); }
  .add-btn:active { transform: scale(.97); }
  .add-btn svg { width: 28px; height: 28px; }

  .input-field {
    flex: 1;
    height: 48px;
    background: #fff;
    border: 2px solid #0a0a0a;
    border-radius: 10px;
    padding: 0 14px;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .input-field:focus { border-color: #16a34a; }

  .menu {
    position: absolute;
    bottom: 64px; left: 0;
    background: #fff;
    border: 1.5px solid #0a0a0a;
    border-radius: 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,.18);
    padding: 6px;
    display: none;
    flex-direction: column;
    min-width: 180px;
    z-index: 5;
  }
  .menu.open { display: flex; }
  .menu button {
    background: none;
    border: none;
    padding: 10px 12px;
    text-align: left;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #1a2c2c;
  }
  .menu button:hover { background: #f1f5f9; }

  /* ── Toolbar ── */
  .toolbar {
    display: flex;
    gap: 8px;
    padding-top: 2px;
  }
  .toolbar button {
    flex: 1;
    padding: 6px 4px;
    font-size: 11px;
    background: rgba(255,255,255,.4);
    border: 1px solid rgba(0,0,0,.2);
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    color: #0f172a;
  }
  .toolbar button:hover { background: rgba(255,255,255,.7); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #0f172a;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: all .25s;
    pointer-events: none;
    z-index: 30;
    max-width: 90vw;
  }
  .toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error   { background: #dc2626; }
  .toast.success { background: #16a34a; }

  /* ── Modal ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(15,23,42,.55);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 20px;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 14px;
    padding: 18px;
    max-width: 380px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    max-height: 85vh;
    overflow-y: auto;
  }
  .modal h3   { font-size: 16px; margin-bottom: 4px; }
  .modal .sub { font-size: 12px; color: #64748b; margin-bottom: 14px; }

  .modal .field { margin-bottom: 10px; }
  .modal .field > label {
    font-size: 11px; font-weight: 700; color: #334155;
    display: block; margin-bottom: 4px;
  }
  .modal .field input,
  .modal .field select,
  .modal .field textarea {
    width: 100%;
    border: 1.5px solid #cbd5e1;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    outline: none;
    font-family: inherit;
    color: #0f172a;
  }
  .modal .field textarea { resize: vertical; min-height: 56px; }
  .modal .field input:focus,
  .modal .field select:focus,
  .modal .field textarea:focus { border-color: #16a34a; }

  .ref-hint {
    font-size: 11px; color: #64748b;
    padding: 6px 8px;
    background: #f8fafc;
    border-radius: 5px;
    margin-top: -4px;
    margin-bottom: 10px;
  }

  .modal-actions {
    display: flex; gap: 8px;
    justify-content: flex-end;
    margin-top: 14px;
  }
  .modal-actions button {
    padding: 8px 14px;
    border: none; border-radius: 6px;
    font-size: 13px; cursor: pointer;
    font-family: inherit; font-weight: 600;
  }
  .btn-primary   { background: #16a34a; color: #fff; }
  .btn-secondary { background: #e2e8f0; color: #334155; }
  .btn-danger    { background: #fecaca; color: #991b1b; }

  /* ── Day modal rows ── */
  .day-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px;
    background: #f8fafc;
    border-radius: 7px;
    margin-bottom: 6px;
  }
  .day-row .dr-name { flex: 1.5; font-size: 12px; font-weight: 600; color: #334155; }
  .day-row .dr-val  { font-size: 14px; font-weight: 700; }
  .day-row .dr-unit { font-size: 11px; color: #64748b; }
  .day-row .dr-note {
    flex: 2; font-size: 11px; color: #94a3b8;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .day-row .dr-del {
    background: none; border: none;
    cursor: pointer; color: #ef4444;
    font-size: 16px; padding: 2px 6px; line-height: 1;
  }
</style>
</head>
<body>

<div class="phone">

  <!-- Metric selector: options populated by JS -->
  <div class="metric-selector">
    <span>Метрика:</span>
    <select id="metricSelect"></select>
  </div>

  <!-- Chart area: filled by renderChartArea() -->
  <div id="chartArea"></div>

  <!-- Note card -->
  <div class="note-card">
    <span>Заметка в свободной форме</span>
    <textarea id="noteEl" placeholder="Самочувствие, лекарства, диета, нагрузка, сон…"></textarea>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="menu" id="menu">
      <button id="menuManual">⌨️ Ввести вручную</button>
    </div>
    <button class="add-btn" id="addBtn" title="Добавить замер">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M9 2h6M10 2v13a2 2 0 0 0 4 0V2" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M10 11h4v4a2 2 0 0 1-4 0v-4z" fill="#fb923c"/>
      </svg>
    </button>
    <input class="input-field" id="quickInput" type="text" placeholder="Заметка (Enter — сохранить)">
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button id="btnClear">🗑 Очистить</button>
    <button id="btnExport">📤 Экспорт</button>
    <button id="btnImport">📥 Импорт</button>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox"></div>
</div>

<script>
// ══════════════════════════════════════════════════════
//  METRICS — справочник показателей
//  ref: диапазон нормы для взрослого мужчины
// ══════════════════════════════════════════════════════
const METRICS = {
  hemoglobin:    { name: 'Гемоглобин',          units: ['g/L', 'g/dL'],      def: 'g/L',    ref: { min: 130,  max: 170  } },
  glucose:       { name: 'Глюкоза',             units: ['mmol/L', 'mg/dL'],  def: 'mmol/L', ref: { min: 3.9,  max: 5.9  } },
  tsh:           { name: 'ТТГ',                 units: ['mIU/L'],            def: 'mIU/L',  ref: { min: 0.4,  max: 4.0  } },
  cholesterol:   { name: 'Общий холестерин',    units: ['mmol/L', 'mg/dL'],  def: 'mmol/L', ref: { min: 3.9,  max: 5.2  } },
  ldl:           { name: 'ЛПНП',                units: ['mmol/L', 'mg/dL'],  def: 'mmol/L', ref: { min: 1.8,  max: 3.0  } },
  hdl:           { name: 'ЛПВП',                units: ['mmol/L', 'mg/dL'],  def: 'mmol/L', ref: { min: 1.0,  max: 1.7  } },
  triglycerides: { name: 'Триглицериды',        units: ['mmol/L', 'mg/dL'],  def: 'mmol/L', ref: { min: 0.5,  max: 1.7  } },
  creatinine:    { name: 'Креатинин',           units: ['μmol/L', 'mg/dL'],  def: 'μmol/L', ref: { min: 62,   max: 115  } },
  alt:           { name: 'АЛТ',                 units: ['U/L'],              def: 'U/L',    ref: { min: 7,    max: 45   } },
  ast:           { name: 'АСТ',                 units: ['U/L'],              def: 'U/L',    ref: { min: 10,   max: 40   } },
  vitaminD:      { name: 'Витамин D (25-OH)',   units: ['nmol/L', 'ng/mL'],  def: 'nmol/L', ref: { min: 75,   max: 150  } },
  ferritin:      { name: 'Ферритин',            units: ['ng/mL', 'μg/L'],    def: 'ng/mL',  ref: { min: 30,   max: 300  } },
  esr:           { name: 'СОЭ',                 units: ['mm/h'],             def: 'mm/h',   ref: { min: 2,    max: 15   } },
};

const MKEYS = Object.keys(METRICS);

// ══════════════════════════════════════════════════════
//  Хранилище
//  Формат: { version: 1, measurements: [...] }
// ══════════════════════════════════════════════════════
const SKEY           = 'healthtracker.data';
const TOAST_DURATION = 2800;   // мс до автоскрытия toast
const NOTE_DEBOUNCE  = 400;    // мс задержки автосохранения заметок
const MAX_VALID_MULT = 20;     // порог нереалистичного значения (ref.max × N)
const NOTE_TRUNC     = 60;     // макс символов заметки в tooltip

function load() {
  try {
    const raw = localStorage.getItem(SKEY);
    return raw ? JSON.parse(raw) : { version: 1, measurements: [] };
  } catch {
    return { version: 1, measurements: [] };
  }
}

function save(data) {
  try {
    localStorage.setItem(SKEY, JSON.stringify(data));
  } catch (e) {
    if (e.name === 'QuotaExceededError') toast('Хранилище заполнено — данные не сохранены', 'error');
    else throw e;
  }
}

function uuid() {
  return crypto.randomUUID?.() ??
    '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, c =>
      (+c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> +c / 4).toString(16));
}

// ══════════════════════════════════════════════════════
//  Кэш данных — один JSON.parse при старте
// ══════════════════════════════════════════════════════
let _data = load();

function getData() { return _data; }

function saveData(data) {
  _data = data;
  save(data);
}

// ══════════════════════════════════════════════════════
//  Состояние
// ══════════════════════════════════════════════════════
let curMetric = MKEYS[0]; // выбранная метрика

// ══════════════════════════════════════════════════════
//  Metric selector — заполняем из METRICS
// ══════════════════════════════════════════════════════
const metricSelect = document.getElementById('metricSelect');

MKEYS.forEach(key => {
  metricSelect.appendChild(new Option(METRICS[key].name, key));
});

metricSelect.value = curMetric;

function setMetric(key) {
  curMetric = key;
  metricSelect.value = key;
  renderChartArea();
}

metricSelect.addEventListener('change', () => setMetric(metricSelect.value));

// ══════════════════════════════════════════════════════
//  SVG chart — константы холста
// ══════════════════════════════════════════════════════
const CW = 340, CH = 220;           // viewBox размер
const PL = 38,  PR = 10;            // отступы лево/право
const PT = 16,  PB = 10;            // отступы верх/низ
const PW = CW - PL - PR;            // ширина области графика
const PH = CH - PT - PB;            // высота области графика

// Сколько дней между двумя ISO-датами
function daysBetween(d1, d2) {
  return Math.round((new Date(d2) - new Date(d1)) / 86400000);
}

// Короткое название месяца
const MON = ['янв','фев','мар','апр','май','июн',
             'июл','авг','сен','окт','ноя','дек'];

const isInRange = (v, m) => v >= m.ref.min && v <= m.ref.max;
const dotColor  = inRef  => inRef ? '#3b82f6' : '#ef4444';

// ══════════════════════════════════════════════════════
//  renderChartArea — строит chart-card или empty-state
// ══════════════════════════════════════════════════════
function renderChartArea() {
  const m    = METRICS[curMetric];
  const all  = getData();
  const area = document.getElementById('chartArea');

  // Фильтруем + сортируем по дате
  const pts = all.measurements
    .filter(e => e.metric === curMetric)
    .sort((a, b) => a.date.localeCompare(b.date));

  // ── Empty state ──────────────────────────────────────
  if (pts.length === 0) {
    area.innerHTML = `
      <div class="empty-state">
        <strong>Нет данных по «${m.name}»</strong>
        Нажмите кнопку с пробиркой и введите первый замер.
      </div>`;
    return;
  }

  // ── Вычисляем диапазон значений для оси Y ───────────
  const vals = pts.map(p => +p.value);
  // Включаем границы нормы: полоса всегда видна, даже если
  // все данные строго внутри или строго вне нормы
  const allY = [...vals, m.ref.min, m.ref.max];
  const vMin = Math.min(...allY);
  const vMax = Math.max(...allY);
  const vPad = Math.max((vMax - vMin) * 0.2, 0.5);
  const yLo  = vMin - vPad;   // нижняя граница оси
  const yHi  = vMax + vPad;   // верхняя граница оси

  // Значение → пиксель по Y (SVG: y растёт вниз)
  function toY(v) {
    const t = (v - yLo) / (yHi - yLo);                  // 0..1
    return PT + PH * (1 - Math.max(0, Math.min(1, t)));  // px
  }

  // ── Вычисляем позиции X, пропорциональные датам ─────
  const first   = pts[0].date;
  const last    = pts[pts.length - 1].date;
  const spanDay = Math.max(1, daysBetween(first, last));

  function toX(date) {
    if (pts.length === 1) return PL + PW / 2;            // единственная точка — по центру
    return PL + (daysBetween(first, date) / spanDay) * PW;
  }

  const colX  = pts.map(p => toX(p.date));
  // Интервал от предыдущего замера в днях (для заголовков)
  const itvl  = pts.map((p, i) =>
    i === 0 ? 'старт' : daysBetween(pts[i - 1].date, p.date) + ' дн.'
  );

  // ── Строим HTML chart-card ───────────────────────────
  area.innerHTML = `
    <div class="chart-card">
      <div class="date-strip">
        <div class="label" id="stripLbl"></div>
      </div>
      <div class="col-headers" id="colHdr"></div>
      <div class="chart-wrap">
        <svg class="chart-svg" id="cSvg"
             viewBox="0 0 ${CW} ${CH}"
             preserveAspectRatio="none"></svg>
        <div class="tooltip" id="tip"></div>
      </div>
      <div class="ref-legend" id="refLeg"></div>
      <div class="date-controls" id="dateCtrls"></div>
    </div>`;

  // ── Date strip label ─────────────────────────────────
  document.getElementById('stripLbl').textContent =
    pts.length === 1
      ? `${m.name}  ·  ${fmtD(first)}  ·  1 замер`
      : `${m.name}  ·  ${fmtD(first)} — ${fmtD(last)}  ·  ${pts.length} замеров`;

  // ── Column headers ───────────────────────────────────
  const hdr = document.getElementById('colHdr');
  hdr.style.gridTemplateColumns = `repeat(${pts.length}, 1fr)`;
  hdr.innerHTML = pts.map((_, i) => `
    <div class="cell">
      <div class="interval">${itvl[i]}</div>
      <div class="num">${i + 1}</div>
    </div>`).join('');

  // ── SVG ─────────────────────────────────────────────
  const svg = document.getElementById('cSvg');
  const NS  = 'http://www.w3.org/2000/svg';

  // Вспомогательная функция создания SVG-элементов
  function el(tag, attrs = {}) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // ── 1. Зелёная полоса нормы (рисуем первой — она под всем) ──
  const refTop = toY(m.ref.max);
  const refBot = toY(m.ref.min);

  svg.appendChild(el('rect', {
    x: PL, y: refTop, width: PW, height: refBot - refTop,
    fill: 'rgba(34,197,94,0.15)',
  }));

  // Пунктирные границы полосы
  [m.ref.min, m.ref.max].forEach(v => {
    svg.appendChild(el('line', {
      x1: PL, x2: PL + PW, y1: toY(v), y2: toY(v),
      stroke: 'rgba(34,197,94,0.65)', 'stroke-width': 1,
      'stroke-dasharray': '5 3',
    }));
  });

  // Метки ref.min и ref.max по оси Y
  [m.ref.min, m.ref.max].forEach(v => {
    const t = el('text', {
      x: PL - 4, y: toY(v) + 3.5,
      'font-size': 8, 'text-anchor': 'end', fill: '#64748b',
    });
    t.textContent = v;
    svg.appendChild(t);
  });

  // ── 2. Вертикальная сетка ──────────────────────────────────
  colX.forEach(x => {
    svg.appendChild(el('line', {
      x1: x, x2: x, y1: PT, y2: PT + PH,
      stroke: '#e2e8f0', 'stroke-width': 1,
    }));
  });

  // ── 3. Линия между точками ────────────────────────────────
  if (pts.length >= 2) {
    svg.appendChild(el('polyline', {
      points: pts.map((p, i) => `${colX[i]},${toY(+p.value)}`).join(' '),
      fill: 'none', stroke: '#94a3b8', 'stroke-width': 2,
      'stroke-linejoin': 'round', 'stroke-linecap': 'round',
    }));
  }

  // ── 4. Точки: синие (в норме) или красные (вне нормы) ────
  pts.forEach((p, i) => {
    const v      = +p.value;
    const inRef  = isInRange(v, m);
    const color  = dotColor(inRef);
    const cx     = colX[i];
    const cy     = toY(v);

    const c = el('circle', {
      cx, cy, r: 5,
      fill: color, stroke: '#fff', 'stroke-width': 2,
      style: 'cursor: pointer',
      'data-v':     p.value,
      'data-date':  p.date,
      'data-unit':  p.unit,
      'data-notes': p.notes || '',
      'data-inref': inRef ? '1' : '0',
      'data-cy':    cy,
      'data-mname': m.name,
    });
    svg.appendChild(c);
  });

  // ── 5. Легенда под графиком ───────────────────────────────
  document.getElementById('refLeg').innerHTML =
    `<div class="swatch-band"></div> норма ${m.ref.min}–${m.ref.max} ${m.def}
     &nbsp;<div class="swatch-dot" style="background:#3b82f6"></div> в норме
     &nbsp;<div class="swatch-dot" style="background:#ef4444"></div> вне нормы`;

  // ── 6. Date chips ─────────────────────────────────────────
  const dc = document.getElementById('dateCtrls');
  dc.style.gridTemplateColumns = `repeat(${pts.length}, 1fr)`;
  dc.innerHTML = pts.map(p => {
    const v     = +p.value;
    const inRef = isInRange(v, m);
    const d     = new Date(p.date + 'T00:00:00');
    return `
      <div class="date-chip" data-date="${p.date}"
           title="${fmtD(p.date)}: ${v} ${esc(p.unit)}">
        <div class="dc-day">${d.getDate()}</div>
        <div class="dc-mon">${MON[d.getMonth()]}</div>
        <div class="dc-val ${inRef ? 'ok' : 'bad'}">${v}</div>
      </div>`;
  }).join('');

}

// ══════════════════════════════════════════════════════
//  Модалка дня — все замеры за выбранную дату
// ══════════════════════════════════════════════════════
function openDayModal(date) {
  const all  = getData();
  // Все замеры за этот день (любая метрика), отсортированные по имени
  const rows = all.measurements
    .filter(e => e.date === date)
    .sort((a, b) =>
      (METRICS[a.metric]?.name || '').localeCompare(METRICS[b.metric]?.name || '')
    );

  const box = document.getElementById('modalBox');

  const rowsHtml = rows.length
    ? rows.map(e => {
        const m     = METRICS[e.metric];
        const v     = +e.value;
        const inRef = m && isInRange(v, m);
        return `
          <div class="day-row">
            <div class="dr-name">${m ? m.name : esc(e.metric)}</div>
            <div class="dr-val ${inRef ? 'ok' : 'bad'}">${e.value}</div>
            <div class="dr-unit">${esc(e.unit)}</div>
            <div class="dr-note" title="${esc(e.notes)}">${esc(e.notes)}</div>
            <button class="dr-del" data-id="${esc(e.id)}" title="Удалить">✕</button>
          </div>`;
      }).join('')
    : `<p style="color:#94a3b8;font-size:13px">Нет данных за этот день.</p>`;

  box.innerHTML = `
    <h3>${fmtD(date)}</h3>
    <div class="sub">${rows.length} показател${ending(rows.length)} за этот день</div>
    ${rowsHtml}
    <div class="modal-actions">
      <button class="btn-secondary" id="dayClose">Закрыть</button>
    </div>`;

  openModal();
}

// Склонение «показатель/показателя/показателей»
function ending(n) {
  if (n % 100 >= 11 && n % 100 <= 19) return 'ей';
  if (n % 10 === 1) return 'ь';
  if (n % 10 >= 2 && n % 10 <= 4) return 'я';
  return 'ей';
}

// Экранирование HTML в пользовательских строках
function esc(s) {
  return String(s || '').replace(
    /[&<>"']/g,
    c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])
  );
}

// ── Форматирование даты ISO → ДД.ММ.ГГГГ ────────────────
function fmtD(iso) {
  const d = new Date(iso + 'T00:00:00');
  return `${String(d.getDate()).padStart(2,'0')}.`
       + `${String(d.getMonth()+1).padStart(2,'0')}.`
       + `${d.getFullYear()}`;
}

// ══════════════════════════════════════════════════════
//  Toast
// ══════════════════════════════════════════════════════
const toastEl = document.getElementById('toast');
let toastTimer;

function toast(msg, cls = '') {
  toastEl.textContent = msg;
  toastEl.className   = ['toast', 'visible', cls].filter(Boolean).join(' ');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('visible'), TOAST_DURATION);
}

// ══════════════════════════════════════════════════════
//  Modal helpers
// ══════════════════════════════════════════════════════
function openModal() {
  document.getElementById('modalBackdrop').classList.add('open');
}

function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
}

// Закрыть по клику на backdrop (вне .modal)
document.getElementById('modalBackdrop').addEventListener('click', e => {
  if (e.target.id === 'modalBackdrop') closeModal();
});

// ══════════════════════════════════════════════════════
//  Модалка ручного ввода
// ══════════════════════════════════════════════════════

// Вызывается делегированным обработчиком #modalBox при клике на mSave
function saveManualEntry() {
  const date   = document.getElementById('mDate').value;
  const metric = document.getElementById('mMetric').value;
  const raw    = document.getElementById('mValue').value.trim();
  const unit   = document.getElementById('mUnit').value;
  const notes  = document.getElementById('mNotes').value.trim();

  if (!date)               { toast('Выберите дату', 'error'); return; }
  if (!raw || isNaN(+raw)) { toast('Введите числовое значение', 'error'); return; }
  const val = +raw;
  const ref = METRICS[metric].ref;
  if (val < 0 || val > ref.max * MAX_VALID_MULT) { toast('Значение выглядит нереалистичным — проверьте ввод', 'error'); return; }

  const data = getData();
  data.measurements.push({ id: uuid(), date, metric, value: val, unit, notes });
  saveData(data);

  closeModal();
  setMetric(metric);
  toast(`${METRICS[metric].name}: ${val} ${unit} сохранено`, 'success');
}

function openManualModal() {
  const _now = new Date();
  const today = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,'0')}-${String(_now.getDate()).padStart(2,'0')}`;
  const box     = document.getElementById('modalBox');

  const metricOpts = MKEYS
    .map(k => `<option value="${k}">${METRICS[k].name}</option>`)
    .join('');

  box.innerHTML = `
    <h3>Добавить замер</h3>
    <div class="sub">Данные сохраняются локально в браузере</div>
    <div class="field">
      <label>Дата</label>
      <input type="date" id="mDate" value="${today}" max="${today}">
    </div>
    <div class="field">
      <label>Показатель</label>
      <select id="mMetric">${metricOpts}</select>
    </div>
    <div class="field">
      <label>Значение</label>
      <input type="number" id="mValue" step="any" placeholder="0.0">
    </div>
    <div class="field">
      <label>Единица</label>
      <select id="mUnit"></select>
    </div>
    <div class="ref-hint" id="mHint"></div>
    <div class="field">
      <label>Заметка</label>
      <input type="text" id="mNotes" placeholder="Натощак, после нагрузки…">
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="mCancel">Отмена</button>
      <button class="btn-primary"   id="mSave">Сохранить</button>
    </div>`;

  openModal();

  // Выставляем текущую метрику и синхронизируем единицы
  const mMetric = document.getElementById('mMetric');
  const mUnit   = document.getElementById('mUnit');
  const mHint   = document.getElementById('mHint');
  mMetric.value = curMetric;

  function syncUnits() {
    const m = METRICS[mMetric.value];
    mUnit.innerHTML = '';
    m.units.forEach(u => mUnit.appendChild(new Option(u, u)));
    mUnit.value       = m.def;
    mHint.textContent = `Норма: ${m.ref.min}–${m.ref.max} ${m.def}`;
  }

  mMetric.addEventListener('change', syncUnits);
  syncUnits();
}

// ══════════════════════════════════════════════════════
//  Кнопка-пробирка + меню
// ══════════════════════════════════════════════════════
const menu   = document.getElementById('menu');
const addBtn = document.getElementById('addBtn');

// Тоггл меню
addBtn.addEventListener('click', e => {
  e.stopPropagation();
  menu.classList.toggle('open');
});

// Закрыть меню при клике вне его
document.addEventListener('click', e => {
  if (!menu.contains(e.target)) menu.classList.remove('open');
});

// Пункт «Ввести вручную»
document.getElementById('menuManual').addEventListener('click', () => {
  menu.classList.remove('open');
  openManualModal();
});

// ══════════════════════════════════════════════════════
//  Toolbar — Очистить / Экспорт / Импорт
// ══════════════════════════════════════════════════════

// ── Очистить всё ─────────────────────────────────────
document.getElementById('btnClear').addEventListener('click', () => {
  const n = getData().measurements.length;
  if (n === 0) { toast('Нет данных для удаления', 'error'); return; }
  if (!confirm(`Удалить все ${n} измерений? Действие необратимо.`)) return;
  saveData({ version: 1, measurements: [] });
  renderChartArea();
  toast('Все данные удалены', 'success');
});

// ── Экспорт JSON ──────────────────────────────────────
document.getElementById('btnExport').addEventListener('click', () => {
  const data = getData();
  const now  = new Date();
  const date = now.toISOString().slice(0, 10);
  const exportData = { ...data, exportedAt: now.toISOString(), appVersion: 1 };
  const blob = new Blob(
    [JSON.stringify(exportData, null, 2)],
    { type: 'application/json' }
  );
  const a = Object.assign(document.createElement('a'), {
    href:     URL.createObjectURL(blob),
    download: `healthtracker-${date}.json`,
  });
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`Экспортировано ${data.measurements.length} измерений`, 'success');
});

// ── Импорт JSON ───────────────────────────────────────
document.getElementById('btnImport').addEventListener('click', () => {
  const inp = document.createElement('input');
  inp.type   = 'file';
  inp.accept = '.json,application/json';

  inp.addEventListener('change', async () => {
    const file = inp.files?.[0];
    if (!file) return;

    let imported;
    try {
      imported = JSON.parse(await file.text());
    } catch {
      toast('Ошибка: файл не является валидным JSON', 'error');
      return;
    }

    // Минимальная проверка структуры
    if (!Array.isArray(imported?.measurements)) {
      toast('Ошибка: нет поля measurements[]', 'error');
      return;
    }

    // Санитизация: пропускаем строки без metric/value/date,
    // добавляем id если его нет (например, файл редактировали вручную)
    const clean = imported.measurements
      .filter(e => e && e.metric && e.date && e.value != null)
      .map(e => ({
        ...e,
        id:    e.id    || uuid(),
        unit:  e.unit  || METRICS[e.metric]?.def || '',
        notes: e.notes || '',
      }));

    const skipped = imported.measurements.length - clean.length;
    if (skipped > 0) toast(`Пропущено ${skipped} неполных записей`, 'error');

    if (clean.length === 0) {
      toast('Файл не содержит корректных измерений', 'error');
      return;
    }

    const cur = getData().measurements.length;
    const msg = cur > 0
      ? `Заменить ${cur} текущих измерений на ${clean.length} из файла?`
      : `Загрузить ${clean.length} измерений из файла?`;
    if (!confirm(msg)) return;

    saveData({ version: 1, measurements: clean });

    // Переключаемся на первую метрику, для которой есть данные
    const firstKey = MKEYS.find(k => clean.some(e => e.metric === k));
    if (firstKey) setMetric(firstKey); else renderChartArea();
    toast(`Импортировано ${clean.length} измерений`, 'success');
  });

  inp.click();
});

// ══════════════════════════════════════════════════════
//  Заметки
// ══════════════════════════════════════════════════════
const NOTE_KEY = 'healthtracker.note';

const noteEl     = document.getElementById('noteEl');
const quickInput = document.getElementById('quickInput');

// Загружаем сохранённую заметку при старте
noteEl.value = localStorage.getItem(NOTE_KEY) || '';

// Любое редактирование textarea — в localStorage с дебаунсом
let noteTimer;
noteEl.addEventListener('input', () => {
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => localStorage.setItem(NOTE_KEY, noteEl.value), NOTE_DEBOUNCE);
});

// Enter в поле ввода → добавить строку с «•» в заметку
quickInput.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const line = quickInput.value.trim();
  if (!line) return;

  // Добавляем к существующему тексту, сохраняем немедленно
  // (явное действие — дебаунс не нужен, но сбрасываем таймер чтобы
  // не затереть результат отложенной записью из noteEl input)
  noteEl.value = noteEl.value
    ? noteEl.value + '\n• ' + line
    : '• ' + line;
  clearTimeout(noteTimer);
  localStorage.setItem(NOTE_KEY, noteEl.value);

  quickInput.value = '';
  toast('Добавлено в заметку', 'success');
});

// ══════════════════════════════════════════════════════
//  Делегированные обработчики (устанавливаются один раз)
// ══════════════════════════════════════════════════════

// Клик по date-chip → модалка дня
document.getElementById('chartArea').addEventListener('click', e => {
  const chip = e.target.closest('.date-chip');
  if (chip) openDayModal(chip.dataset.date);
});

// Тултип при наведении на точку графика (делегирован на #chartArea)
document.getElementById('chartArea').addEventListener('mouseover', e => {
  const dot = e.target.closest('circle[data-v]');
  if (!dot) return;
  const svg = dot.closest('svg');
  const tip = document.getElementById('tip');
  if (!svg || !tip) return;

  const svgRect = svg.getBoundingClientRect();
  const dotRect = dot.getBoundingClientRect();
  const tipX    = dotRect.left + dotRect.width / 2 - svgRect.left;
  const tipY    = dotRect.top  - svgRect.top;
  const cy      = +dot.dataset.cy;

  const inRef  = dot.dataset.inref === '1';
  const color  = dotColor(inRef);
  const status = inRef ? '✓ норма' : '⚠ вне нормы';
  const raw    = dot.dataset.notes;
  const noteText = raw
    ? esc(raw.length > NOTE_TRUNC ? raw.slice(0, NOTE_TRUNC) + '…' : raw)
    : '';

  // Устанавливаем содержимое до позиционирования,
  // чтобы offsetWidth вернул реальную ширину тултипа
  tip.innerHTML =
    `<b>${dot.dataset.mname}</b><br>` +
    `<span style="color:${color}">${dot.dataset.v} ${esc(dot.dataset.unit)} — ${status}</span><br>` +
    `<span style="opacity:.75">${fmtD(dot.dataset.date)}</span>` +
    (noteText ? `<br><span style="opacity:.6">${noteText}</span>` : '');

  // Зажимаем X так, чтобы тултип не выходил за границы SVG
  const halfW     = tip.offsetWidth / 2;
  const clampedX  = Math.max(halfW, Math.min(tipX, svgRect.width - halfW));

  tip.style.left      = clampedX + 'px';
  tip.style.top       = tipY + 'px';
  tip.style.transform = (cy < PT + PH / 3)
    ? 'translate(-50%, 14px)'
    : 'translate(-50%, -120%)';

  tip.classList.add('visible');
});

document.getElementById('chartArea').addEventListener('mouseout', e => {
  const dot = e.target.closest('circle[data-v]');
  if (dot && dot !== e.relatedTarget?.closest('circle[data-v]')) {
    document.getElementById('tip').classList.remove('visible');
  }
});

// Все клики внутри #modalBox: ручной ввод + модалка дня
document.getElementById('modalBox').addEventListener('click', e => {
  if (e.target.id === 'mCancel') { closeModal(); return; }
  if (e.target.id === 'mSave')   { saveManualEntry(); return; }
  if (e.target.id === 'dayClose') { closeModal(); return; }

  const del = e.target.closest('.dr-del');
  if (del) {
    if (!confirm('Удалить это измерение?')) return;
    const data = getData();
    data.measurements = data.measurements.filter(m => m.id !== del.dataset.id);
    saveData(data);
    closeModal();
    renderChartArea();
    toast('Измерение удалено', 'success');
  }
});

// ══════════════════════════════════════════════════════
//  Старт
// ══════════════════════════════════════════════════════
renderChartArea();
</script>
